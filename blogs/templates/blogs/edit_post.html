{% extends "blogs/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
  <h1 class="h2">Редактирование публикации</h1>
{% endblock page_header %}

{% block content %}
  <form method="post" action="{% url 'blogs:edit_post' post.id %}" class="form">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% buttons %}
      <button name="submit" class="btn btn-primary">Сохранить изменения</button>
      <a href="{% url 'blogs:index' %}" class="btn btn-outline-secondary">Отмена</a>
    {% endbuttons %}
  </form>
{% endblock content %}
